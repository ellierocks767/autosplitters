[workspace]
git_only = true             # track releases with git tags; nothing goes to crates.io
git_release_enable = true
semver_check = false
changelog_update = true
git_tag_name = "{{ package }}-v{{ version }}"
# Release user-facing changes and conventional breaking changes.
release_commits = '^((feat|fix|perf|security)(\([^)]*\))?!?:|[a-z]+(\([^)]*\))?!:)'

[changelog]
# Keep merge and routine maintenance commits out of release notes.
commit_parsers = [
    { message = "^Merge ", skip = true },
    { message = '^(ci|build|chore\(deps[^)]*\)):', skip = true },
    { message = '^chore\([^)]*\): release v', skip = true },
    { message = "^feat", group = "added" },
    { message = "^changed", group = "changed" },
    { message = "^deprecated", group = "deprecated" },
    { message = "^fix", group = "fixed" },
    { message = "^security", group = "security" },
    { message = "^.*", group = "other" },
]

# Keep the pre-monorepo tag style (lsw1-v0.1.1) rather than lsw1_wasm-v0.1.1.
[[package]]
name = "lsw1_wasm"
git_tag_name = "lsw1-v{{ version }}"

# Keep the crate name (so the build stays sadx_livesplit_one.wasm) with short sadx-v tags.
[[package]]
name = "sadx-livesplit-one"
git_tag_name = "sadx-v{{ version }}"
